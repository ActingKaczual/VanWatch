name: Van Watch

on:
  schedule:
    # 7am + 7pm Eastern (11:00 / 23:00 UTC during EDT)
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_listings.py

      - name: Commit state + digest
        run: |
          git config user.name "van-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_vins.json docs/index.html
          git diff --cached --quiet || git commit -m "van watch: update state + digest"
          git push
